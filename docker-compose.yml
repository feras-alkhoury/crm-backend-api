services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://crm_user:crm_dev_password@db:5432/crm_db
      SECRET_KEY: crm-development-secret-change-this
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
